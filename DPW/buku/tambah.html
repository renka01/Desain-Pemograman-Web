        <nav>

    <main>
        <section>
            <h2>Tambah Buku</h2>
            <form>
                <p><label for="judul">Judul</label> <input type="text" id="judul" name="judul"></p>
                <p><label for="pengarang">Pengarang</label> <input type="text" id="pengarang" name="pengarang"></p>
                <p><label for="tahun">Tahun Terbit</label> <input type="text" id="tahun" name="tahun"></p>
                <p><label for="isbn">ISBN</label> <input type="text" id="isbn" name="isbn"></p>
                <p><label for="stok">Jumlah Stok</label> <input type="text" id="stok" name="stok"></p>
                <p>
                    <label for="kategori">Kategori</label>
                    <select id="kategori" name="kategori">
                        <option value="Fiksi">Fiksi</option>
                        <option value="non-fiksi">Non-Fiksi</option>
                        <option value="referensi">Referensi</option>
                    </select>
                </p>
                <p>
                    <button type="submit">Simpan</button>
                    <button type="button">Kembali</button>
                </p>
            </form>
        </section>
    </main>
